<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSAV Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f5f9;
      color: #1e293b;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      background: linear-gradient(135deg, #003F6B, #0077B6);
      color: white;
      padding: 20px 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header span { font-size: 13px; opacity: 0.85; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h2 {
      font-size: 16px;
      color: #0077B6;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e0f2fe;
    }
    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .form-group {
      flex: 1;
      min-width: 180px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }
    select, input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    select:focus, input:focus {
      border-color: #0077B6;
    }
    button {
      background: #0077B6;
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #005a8a; }
    button.danger {
      background: #dc2626;
      padding: 6px 12px;
      font-size: 12px;
    }
    button.danger:hover { background: #b91c1c; }
    .files-list {
      max-height: 400px;
      overflow-y: auto;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
      gap: 10px;
    }
    .file-item:last-child { border-bottom: none; }
    .file-info { flex: 1; }
    .file-name { font-weight: 600; font-size: 14px; }
    .file-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 6px;
    }
    .badge.cours { background: #dbeafe; color: #1d4ed8; }
    .badge.td { background: #dcfce7; color: #15803d; }
    .badge.devoirs { background: #fef9c3; color: #a16207; }
    .badge.examens { background: #fee2e2; color: #b91c1c; }
    .empty {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
    .status {
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
    .status.success { background: #dcfce7; color: #15803d; display: block; }
    .status.error { background: #fee2e2; color: #b91c1c; display: block; }
    #gemAspectGroup { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>ESSAV Admin</h1>
        <span>Gestion des fichiers académiques</span>
      </div>
    </header>

    <div id="status" class="status"></div>

    <!-- إضافة ملف -->
    <div class="card">
      <h2>Ajouter un fichier</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Matière</label>
          <select id="subject">
            <optgroup label="S1">
              <option value="Math">Mathématiques</option>
              <option value="Physique">Physique</option>
              <option value="Chimie">Chimie</option>
              <option value="Anglais">Anglais</option>
              <option value="Francais">Français</option>
              <option value="Biologie">Biologie</option>
              <option value="Microbiologie">Microbiologie</option>
              <option value="Genetique">Génétique</option>
              <option value="Informatique">Informatique</option>
              <option value="Statistique">Statistique</option>
            </optgroup>
            <optgroup label="S2">
              <option value="Francais2">Français 2</option>
              <option value="Anglais2">Anglais 2</option>
              <option value="GEM">GEM</option>
              <option value="GAB">GAB</option>
              <option value="PPV">PPV</option>
              <option value="TIC">TIC</option>
              <option value="STA">STA</option>
              <option value="PSA">PSA</option>
            </optgroup>
            <optgroup label="S3 - PPV">
              <option value="Francais3">Français 3</option>
              <option value="EconomieGestion">Économie et Gestion</option>
              <option value="Agronomie">Agronomie</option>
              <option value="Horticulture">Horticulture</option>
              <option value="Pesticides">Pesticides</option>
              <option value="Entomologie">Entomologie</option>
              <option value="ScienceSols">Science des Sols</option>
              <option value="SciencePlantes">Science des Plantes</option>
            </optgroup>
            <optgroup label="S3 - GAB">
              <option value="ResistanceMateriaux">Résistance de matériaux</option>
              <option value="EnergieRenouvelable">Énergie renouvelable</option>
              <option value="Environnement">Environnement</option>
              <option value="Topographie">Topographie</option>
              <option value="DAO">DAO</option>
              <option value="MecaniqueFluides">Mécanique de fluides</option>
              <option value="ChimieEau">Chimie de l'eau</option>
            </optgroup>
            <optgroup label="S4 - PPV">
              <option value="Vulgarisation">Vulgarisation</option>
              <option value="TechniquePropagation">Technique de propagation</option>
              <option value="TechniqueIrrigation">Technique d'irrigation</option>
              <option value="Ecophysiologie">Ecophysiologie végétale</option>
              <option value="BiochimieStructurale">Biochimie structurale</option>
              <option value="FertiliteSol">Fertilité du sol</option>
              <option value="MethodesDiagnostic">Méthodes de diagnostic</option>
              <option value="Malherbologie">Malherbologie</option>
              <option value="BesoinEau">Besoin en eau</option>
            </optgroup>
          </select>
        </div>
        <div class="form-group" id="gemAspectGroup">
          <label>Aspect GEM</label>
          <select id="gemAspect">
            <option value="Dessin">Dessin</option>
            <option value="Electricite">Électricité</option>
          </select>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="fileType">
            <option value="Cours">Cours</option>
            <option value="TD">TD</option>
            <option value="Devoirs">Devoirs</option>
            <option value="Examens">Examens</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Nom du fichier</label>
          <input type="text" id="fileName" placeholder="Ex: Cours 1 - Introduction.pdf">
        </div>
        <div class="form-group">
          <label>Lien Google Drive</label>
          <input type="text" id="fileUrl" placeholder="https://drive.google.com/file/d/...">
        </div>
      </div>
      <button onclick="addFile()">Ajouter le fichier</button>
    </div>

    <!-- قائمة الملفات -->
    <div class="card">
      <h2>Fichiers existants</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Filtrer par matière</label>
          <select id="filterSubject" onchange="loadFiles()">
            <option value="">-- Toutes --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Filtrer par type</label>
          <select id="filterType" onchange="loadFiles()">
            <option value="">-- Tous --</option>
            <option value="Cours">Cours</option>
            <option value="TD">TD</option>
            <option value="Devoirs">Devoirs</option>
            <option value="Examens">Examens</option>
          </select>
        </div>
      </div>
      <div class="files-list" id="filesList">
        <div class="empty">Chargement...</div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script>
    // ===== Firebase Config =====
    const firebaseConfig = {
      apiKey: "AIzaSyDnrW6WnmbEFpbWzlW9IGglxAafajt2Kyo",
      authDomain: "iset-b9974.firebaseapp.com",
      databaseURL: "https://iset-b9974-default-rtdb.firebaseio.com",
      projectId: "iset-b9974",
      storageBucket: "iset-b9974.firebasestorage.app",
      messagingSenderId: "1054170284751",
      appId: "1:1054170284751:web:8f02232478430d5ae2adba"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ===== Helpers =====
    const subjectSelect = document.getElementById('subject');
    const gemGroup = document.getElementById('gemAspectGroup');

    subjectSelect.addEventListener('change', () => {
      gemGroup.style.display = subjectSelect.value === 'GEM' ? 'block' : 'none';
    });

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
      setTimeout(() => el.className = 'status', 4000);
    }

    function getPath(subject, type, gemAspect) {
      if (subject === 'GEM' && gemAspect) {
        return `files/GEM/\( {gemAspect}/ \){type}`;
      }
      return `files/\( {subject}/ \){type}`;
    }

    // ===== Add File =====
    async function addFile() {
      const subject = document.getElementById('subject').value;
      const type = document.getElementById('fileType').value;
      const name = document.getElementById('fileName').value.trim();
      const url = document.getElementById('fileUrl').value.trim();
      const gemAspect = document.getElementById('gemAspect').value;

      if (!name || !url) {
        showStatus('Veuillez remplir le nom et le lien', 'error');
        return;
      }

      const path = getPath(subject, type, gemAspect);
      try {
        await db.ref(path).push({ name, url });
        showStatus('Fichier ajouté avec succès !', 'success');
        document.getElementById('fileName').value = '';
        document.getElementById('fileUrl').value = '';
        loadFiles();
      } catch (e) {
        showStatus('Erreur : ' + e.message, 'error');
      }
    }

    // ===== Load & Delete Files =====
    async function loadFiles() {
      const list = document.getElementById('filesList');
      list.innerHTML = '<div class="empty">Chargement...</div>';

      const filterSubject = document.getElementById('filterSubject').value;
      const filterType = document.getElementById('filterType').value;

      try {
        const snapshot = await db.ref('files').once('value');
        const data = snapshot.val() || {};
        let files = [];

        // Flatten structure
        for (const [subjectKey, subjectData] of Object.entries(data)) {
          if (subjectKey === 'GEM') {
            for (const [aspect, aspectData] of Object.entries(subjectData || {})) {
              for (const [type, typeData] of Object.entries(aspectData || {})) {
                for (const [key, file] of Object.entries(typeData || {})) {
                  files.push({
                    key, subject: 'GEM', gemAspect: aspect, type,
                    name: file.name, url: file.url,
                    path: `files/GEM/\( {aspect}/ \){type}/${key}`
                  });
                }
              }
            }
          } else {
            for (const [type, typeData] of Object.entries(subjectData || {})) {
              for (const [key, file] of Object.entries(typeData || {})) {
                files.push({
                  key, subject: subjectKey, gemAspect: '', type,
                  name: file.name, url: file.url,
                  path: `files/\( {subjectKey}/ \){type}/${key}`
                });
              }
            }
          }
        }

        // Filter
        if (filterSubject) files = files.filter(f => f.subject === filterSubject);
        if (filterType) files = files.filter(f => f.type === filterType);

        // Fill filter subjects
        const filterSel = document.getElementById('filterSubject');
        if (filterSel.options.length <= 1) {
          const subjects = [...new Set(files.map(f => f.subject))].sort();
          subjects.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            filterSel.appendChild(opt);
          });
        }

        if (files.length === 0) {
          list.innerHTML = '<div class="empty">Aucun fichier trouvé</div>';
          return;
        }

        list.innerHTML = files.map(f => `
          <div class="file-item">
            <div class="file-info">
              <div class="file-name">${f.name}</div>
              <div class="file-meta">
                <span class="badge \( {f.type.toLowerCase()}"> \){f.type}</span>
                \( {f.subject} \){f.gemAspect ? ' / ' + f.gemAspect : ''}
              </div>
            </div>
            <button class="danger" onclick="deleteFile('${f.path}')">Supprimer</button>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = `<div class="empty">Erreur : ${e.message}</div>`;
      }
    }

    async function deleteFile(path) {
      if (!confirm('Supprimer ce fichier ?')) return;
      try {
        await db.ref(path).remove();
        showStatus('Fichier supprimé', 'success');
        loadFiles();
      } catch (e) {
        showStatus('Erreur : ' + e.message, 'error');
      }
    }

    // Init
    loadFiles();
  </script>
</body>
</html>
