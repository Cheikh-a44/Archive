<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultats - ESAV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --c-primary: #0a7ea4;
      --c-primary-dark: #065a75;
      --c-primary-light: #e6f4f9;
      --c-text: #1e293b;
      --c-text-soft: #64748b;
      --c-border: #e2e8f0;
      --c-bg: #f4f8fb;
      --c-white: #ffffff;
      --c-success: #16a34a;
      --c-success-bg: #dcfce7;
      --c-error: #dc2626;
      --c-error-bg: #fee2e2;
      --radius: 8px;
      --shadow: 0 2px 10px rgba(10, 126, 164, 0.08);
    }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      line-height: 1.5;
    }
    h1, h2, h3, h4, label, .btn, th {
      font-family: 'League Spartan', sans-serif;
      letter-spacing: 0.3px;
    }
    .topbar {
      background: var(--c-white);
      padding: 14px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      color: var(--c-primary);
      font-size: 24px;
      letter-spacing: 4px;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .nav-links a {
      color: var(--c-text-soft);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .nav-links a:hover { color: var(--c-primary); }
    .nav-links a.active { color: var(--c-primary); font-weight: 700; }

    .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
    .hero-title { text-align: center; margin-bottom: 24px; }
    .hero-title h1 { font-size: 28px; font-weight: 800; color: var(--c-text); margin-bottom: 6px; }
    .hero-title p { color: var(--c-text-soft); font-size: 14px; }

    .card {
      background: var(--c-white);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .dept-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .dept-btn {
      padding: 10px 22px;
      background: var(--c-white);
      color: var(--c-text-soft);
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'League Spartan', sans-serif;
      transition: all 0.15s;
    }
    .dept-btn:hover { border-color: var(--c-primary); color: var(--c-primary); }
    .dept-btn.active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }

    .search-box {
      display: flex;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
    }
    .search-box input {
      flex: 1;
      padding: 13px 16px;
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .search-box input:focus { border-color: var(--c-primary); }
    .search-box button {
      padding: 13px 24px;
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'League Spartan', sans-serif;
    }
    .search-box button:hover { background: var(--c-primary-dark); }
    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }

    .student-info {
      background: var(--c-primary-light);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .student-info h3 { color: var(--c-primary-dark); font-size: 18px; font-weight: 700; }
    .student-info p { color: var(--c-text-soft); font-size: 13px; }

    .status-pill {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'League Spartan', sans-serif;
    }
    .status-pill.valid { background: var(--c-success-bg); color: #166534; }
    .status-pill.invalid { background: var(--c-error-bg); color: #991b1b; }
    .status-pill.pending { background: #fef3c7; color: #92400e; }

    .semester-pill {
      display: inline-block;
      background: var(--c-primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 13px;
      font-family: 'League Spartan', sans-serif;
      letter-spacing: 1px;
      margin-left: 4px;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--c-border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 600px;
    }
    th, td {
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid var(--c-border);
    }
    th {
      background: #f8fafc;
      font-weight: 700;
      color: var(--c-text);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td.subject-name { text-align: left; padding-left: 20px; color: var(--c-text); }
    tr.module-row td {
      background: var(--c-primary-light);
      font-weight: 700;
      color: var(--c-primary-dark);
      border-top: 2px solid var(--c-primary);
    }
    tr.module-row td:first-child { text-align: left; }
    tr.module-row td:nth-child(2) { text-align: left; }
    tr.total-row td {
      background: #f8fafc;
      font-weight: 700;
      color: var(--c-text);
      border-top: 2px solid var(--c-border);
    }
    .badge-C { color: var(--c-success); font-weight: 700; }
    .badge-NC { color: var(--c-error); font-weight: 700; }
    .badge-V { color: var(--c-success); font-weight: 700; }
    .badge-NV { color: var(--c-error); font-weight: 700; }
    .note-value { font-weight: 600; }
    .note-missing { color: #94a3b8; font-style: italic; font-size: 11px; }

    .info-box {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #92400e;
      line-height: 1.6;
    }
    .info-box.success {
      background: var(--c-success-bg);
      border-left-color: var(--c-success);
      color: #166534;
    }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--c-text-soft); }
    .empty-state h3 { color: var(--c-text); margin-bottom: 8px; font-size: 18px; }

    .pdf-btn {
      display: block;
      margin: 20px auto 0;
      padding: 13px 32px;
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'League Spartan', sans-serif;
    }
    .pdf-btn:hover { background: var(--c-primary-dark); }

    .loading { text-align: center; padding: 40px; color: var(--c-text-soft); }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--c-primary-light);
      border-top-color: var(--c-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .missing-table { margin-top: 16px; }
    .missing-table th { background: var(--c-error-bg); color: #991b1b; }
    .missing-table td { font-size: 13px; }

    @media (max-width: 600px) {
      .container { padding: 16px 12px 40px; }
      .card { padding: 18px; }
      .hero-title h1 { font-size: 22px; }
      .search-box { flex-direction: column; }
      .search-box button { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="logo">ESAV</a>
      <div class="nav-links">
        <a href="index.html">Accueil</a>
        <a href="resultats.html" class="active">Resultats</a>
        <a href="contribuer.html">Contribuer</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="hero-title">
      <h1>Consultation des resultats</h1>
      <p>Entrez votre numero d'etudiant pour voir vos notes</p>
    </div>

    <div class="card">
      <div class="dept-selector" id="deptSelector">
        <button type="button" class="dept-btn active" data-dept="PPV">PPV</button>
        <button type="button" class="dept-btn" data-dept="GAB">GAB</button>
        <button type="button" class="dept-btn" data-dept="GEM">GEM</button>
        <button type="button" class="dept-btn" data-dept="PSA">PSA</button>
        <button type="button" class="dept-btn" data-dept="STA">STA</button>
        <button type="button" class="dept-btn" data-dept="TC">TC</button>
      </div>

      <div class="search-box">
        <input type="text" id="studentIdInput" placeholder="Numero d'etudiant" autocomplete="off">
        <button type="button" id="searchBtn">Rechercher</button>
      </div>
    </div>

    <div id="resultContainer"></div>
  </div>

  <!-- Firebase SDK (compat, comme dans main.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>

  <!-- Config centralisee -->
  <script src="config.js"></script>

  <script>
  (function () {
    'use strict';

    // ==================== FIREBASE ====================
    let db = null;
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      db = firebase.database();
    } catch (e) {
      console.error('Firebase init error:', e);
    }

    // ==================== ETAT ====================
    var DEPT_SEMESTERS = {
      TC:  ['S1', 'S2'],
      PPV: ['S3', 'S4', 'S5', 'S6'],
      GAB: ['S3', 'S4', 'S5', 'S6'],
      GEM: ['S3', 'S4', 'S5', 'S6'],
      PSA: ['S3', 'S4', 'S5', 'S6'],
      STA: ['S3', 'S4', 'S5', 'S6']
    };

    var selectedDept = 'PPV';
    var structure = {};
    var noTPSubjects = [];
    var pdfState = null;

    // ==================== HELPERS ====================
    function displayName(s) {
      return String(s || '').replace(/_/g, ' ');
    }
    function hasTP(subject) {
      return noTPSubjects.indexOf(subject) === -1;
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function normalizeType(t) {
      var s = String(t || '').toLowerCase().trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (s.indexOf('rattrap') !== -1) return 'Rattrapage';
      if (s.indexOf('examen') !== -1 || s === 'exam') return 'Examen';
      if (s.indexOf('controle') !== -1 || s === 'cc') return 'Controle continu';
      if (s === 'tp' || s.indexOf('travaux') !== -1) return 'TP';
      return String(t || '').trim();
    }
    function normalizeNote(v) {
      if (v === undefined || v === null || v === '') return null;
      var n = parseFloat(String(v).replace(',', '.'));
      return isNaN(n) ? null : n;
    }

    // ==================== CHARGE STRUCTURE ====================
    function loadStructure() {
      return Promise.all([
        db.ref('structure').once('value').then(function (s) {
          structure = s.val() || {};
        }),
        db.ref('no_tp_subjects').once('value').then(function (s) {
          noTPSubjects = s.val() || [];
        })
      ]).then(function () {
        console.log('Structure chargee:', Object.keys(structure));
        console.log('No TP subjects:', noTPSubjects.length);
      });
    }

    function getSubjectsForDeptSem(dept, sem) {
      var modules = (structure[dept] || {})[sem] || {};
      var subjects = [];
      Object.keys(modules).forEach(function (modKey) {
        var mod = modules[modKey];
        (mod.subjects || []).forEach(function (s) {
          if (subjects.indexOf(s) === -1) subjects.push(s);
        });
      });
      return subjects;
    }

    function getCredits(dept, sem, subject) {
      var modules = (structure[dept] || {})[sem] || {};
      var result = 3;
      Object.keys(modules).forEach(function (modKey) {
        var mod = modules[modKey];
        if (mod.subjectCredits && mod.subjectCredits[subject] !== undefined) {
          result = mod.subjectCredits[subject];
        }
      });
      return result;
    }

    // ==================== VERIFICATION ====================
    function checkCompleteness(notes, dept, sem) {
      var subjects = getSubjectsForDeptSem(dept, sem);
      var missing = [];

      subjects.forEach(function (subject) {
        var n = notes[subject] || {};
        var m = [];
        var hasExam = n['Examen'] !== undefined;
        var hasRatt = n['Rattrapage'] !== undefined;
        if (!hasExam && !hasRatt) m.push('Examen');
        if (n['Controle continu'] === undefined) m.push('CC');
        if (hasTP(subject) && n['TP'] === undefined) m.push('TP');
        if (m.length > 0) missing.push({ subject: subject, missing: m });
      });

      return {
        complete: missing.length === 0,
        missing: missing,
        total: subjects.length,
        completeCount: subjects.length - missing.length
      };
    }

    // ==================== CALCUL ====================
    function calculateResults(notes, dept, sem) {
      var modules = (structure[dept] || {})[sem] || {};
      var allSubjects = getSubjectsForDeptSem(dept, sem);
      if (allSubjects.length === 0) return null;

      var subjectAvg = {};
      var subjectSR = {};

      allSubjects.forEach(function (subject) {
        var n = notes[subject] || {};
        var exam = n['Examen'] !== undefined ? n['Examen'] : 0;
        var cc = n['Controle continu'] !== undefined ? n['Controle continu'] : 0;
        var tp = n['TP'] !== undefined ? n['TP'] : 0;
        var ratt = n['Rattrapage'];

        var useSR = ratt !== undefined && ratt > exam;
        subjectSR[subject] = useSR;
        var finalExam = useSR ? ratt : exam;

        if (hasTP(subject)) {
          subjectAvg[subject] = (tp + cc * 2 + finalExam * 3) / 6;
        } else {
          subjectAvg[subject] = (cc * 2 + finalExam * 3) / 5;
        }
      });

      var moduleAvg = {};
      Object.keys(modules).forEach(function (modKey) {
        var mod = modules[modKey];
        var totalW = 0, totalC = 0;
        (mod.subjects || []).forEach(function (subject) {
          var c = getCredits(dept, sem, subject);
          totalW += (subjectAvg[subject] || 0) * c;
          totalC += c;
        });
        moduleAvg[modKey] = totalC > 0 ? totalW / totalC : 0;
      });

      var totalW = 0, totalC = 0;
      allSubjects.forEach(function (subject) {
        var c = getCredits(dept, sem, subject);
        totalW += (subjectAvg[subject] || 0) * c;
        totalC += c;
      });
      var overallAvg = totalC > 0 ? totalW / totalC : 0;

      var subjectStatus = {};
      Object.keys(modules).forEach(function (modKey) {
        var mod = modules[modKey];
        (mod.subjects || []).forEach(function (subject) {
          if (subjectAvg[subject] >= 10) subjectStatus[subject] = 'C';
          else if (subjectAvg[subject] >= 7 && moduleAvg[modKey] >= 10) subjectStatus[subject] = 'C';
          else subjectStatus[subject] = 'NC';
        });
      });

      var moduleStatus = {};
      var moduleCredits = {};
      Object.keys(modules).forEach(function (modKey) {
        var mod = modules[modKey];
        var allC = true, earned = 0;
        (mod.subjects || []).forEach(function (subject) {
          var c = getCredits(dept, sem, subject);
          if (subjectStatus[subject] === 'C') earned += c;
          else allC = false;
        });
        moduleCredits[modKey] = earned;
        moduleStatus[modKey] = (moduleAvg[modKey] >= 10 && allC) ? 'V' : 'NV';
      });

      var hasNV = Object.keys(moduleStatus).some(function (k) { return moduleStatus[k] === 'NV'; });
      var semesterStatus = (overallAvg >= 10 && !hasNV) ? 'Valide' : 'Non Valide';
      var hasSR = Object.keys(subjectSR).some(function (k) { return subjectSR[k] === true; });

      return {
        subjectAvg: subjectAvg, subjectStatus: subjectStatus,
        moduleAvg: moduleAvg, moduleStatus: moduleStatus, moduleCredits: moduleCredits,
        overallAvg: Math.round(overallAvg * 100) / 100,
        semesterStatus: semesterStatus, hasSR: hasSR,
        modules: modules, subjectSR: subjectSR
      };
    }

    // ==================== DOM ====================
    var resultContainer = document.getElementById('resultContainer');
    var studentIdInput = document.getElementById('studentIdInput');
    var searchBtn = document.getElementById('searchBtn');

    // ==================== DELEGATION DE CLIC ====================
    // Une seule listener sur le conteneur parent pour TOUS les boutons
    document.getElementById('deptSelector').addEventListener('click', function (e) {
      var btn = e.target.closest('.dept-btn');
      if (!btn) return;
      selectedDept = btn.getAttribute('data-dept');
      var allBtns = document.querySelectorAll('.dept-btn');
      for (var i = 0; i < allBtns.length; i++) allBtns[i].classList.remove('active');
      btn.classList.add('active');
      resultContainer.innerHTML = '';
      console.log('Departement selectionne:', selectedDept);
    });

    searchBtn.addEventListener('click', searchStudent);
    studentIdInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') searchStudent();
    });

    // ==================== SEARCH ====================
    function searchStudent() {
      var studentId = studentIdInput.value.trim();
      if (!studentId) {
        alert('Veuillez entrer votre numero');
        return;
      }
      if (!db) {
        resultContainer.innerHTML = '<div class="card"><div class="empty-state"><h3>Erreur Firebase</h3><p>Verifiez la configuration.</p></div></div>';
        return;
      }

      console.log('Recherche:', studentId, 'dans', selectedDept);

      pdfState = null;
      searchBtn.disabled = true;
      searchBtn.textContent = 'Chargement...';
      resultContainer.innerHTML = '<div class="card"><div class="loading"><div class="spinner"></div>Chargement...</div></div>';

      var semesters = DEPT_SEMESTERS[selectedDept] || [];

      Promise.all(semesters.map(function (sem) {
        return db.ref('results/' + selectedDept + '/' + sem + '/' + studentId).once('value')
          .then(function (snap) {
            return { sem: sem, snap: snap };
          })
          .catch(function (err) {
            console.error('Erreur lecture ' + sem + ':', err);
            return { sem: sem, snap: null };
          });
      })).then(function (results) {
        var found = [];
        results.forEach(function (r) {
          if (!r.snap || !r.snap.exists()) return;
          var data = r.snap.val();
          var studentName = '';
          var notes = {};
          Object.keys(data).forEach(function (key) {
            var e = data[key];
            if (e.name && !studentName) studentName = e.name;
            if (e.subject) {
              if (!notes[e.subject]) notes[e.subject] = {};
              var t = normalizeType(e.type);
              var g = normalizeNote(e.grade);
              if (g !== null) notes[e.subject][t] = g;
            }
          });
          console.log('Trouve en ' + r.sem + ':', notes);
          found.push({ sem: r.sem, notes: notes, studentName: studentName });
        });

        if (found.length === 0) {
          resultContainer.innerHTML =
            '<div class="card"><div class="empty-state">' +
            '<h3>Aucun resultat trouve</h3>' +
            '<p>Verifiez votre numero et le departement selectionne.</p>' +
            '</div></div>';
          return;
        }

        var allHtml = '';
        found.forEach(function (f) {
          var requiredSubjects = getSubjectsForDeptSem(selectedDept, f.sem);
          var check = checkCompleteness(f.notes, selectedDept, f.sem);
          console.log('Semestre ' + f.sem + ': ' + check.completeCount + '/' + check.total + ' completes');

          if (check.complete && requiredSubjects.length > 0) {
            var results2 = calculateResults(f.notes, selectedDept, f.sem);
            if (results2) {
              pdfState = {
                notes: f.notes, results: results2,
                studentId: studentId, studentName: f.studentName,
                dept: selectedDept, sem: f.sem
              };
              allHtml += renderComplete(studentId, f.studentName, f.notes, results2, selectedDept, f.sem);
            }
          } else {
            allHtml += renderPartial(studentId, f.studentName, f.notes, selectedDept, f.sem, check);
          }
        });
        resultContainer.innerHTML = allHtml;

      }).catch(function (err) {
        console.error(err);
        resultContainer.innerHTML =
          '<div class="card"><div class="empty-state">' +
          '<h3>Erreur</h3><p>' + esc(err.message) + '</p>' +
          '</div></div>';
      }).then(function () {
        searchBtn.disabled = false;
        searchBtn.textContent = 'Rechercher';
      });
    }

    // ==================== RENDER COMPLETE ====================
    function renderComplete(studentId, studentName, notes, r, dept, sem) {
      var showSR = r.hasSR;
      var colspanTotal = showSR ? 6 : 5;

      var html =
        '<div class="card">' +
        '<div class="student-info">' +
        '<div>' +
        '<h3>' + esc(studentName || 'Etudiant') + '</h3>' +
        '<p>Numero : <strong>' + esc(studentId) + '</strong> | ' +
        'Departement : <strong>' + esc(dept) + '</strong> | ' +
        '<span class="semester-pill">' + esc(sem) + '</span></p>' +
        '</div>' +
        '<span class="status-pill ' + (r.semesterStatus === 'Valide' ? 'valid' : 'invalid') + '">' +
        r.semesterStatus + '</span>' +
        '</div>';

      html += '<div class="info-box success">' +
        '<strong>Resultats complets.</strong> ' +
        'Moyenne du semestre : <strong>' + r.overallAvg + ' / 20</strong>' +
        '</div>';

      html += '<div class="table-wrap"><table><thead><tr>' +
        '<th>Module</th><th>Matiere</th><th>TP</th><th>CC</th><th>Exam</th>' +
        (showSR ? '<th>SR</th>' : '') +
        '<th>Moy</th><th>Credit</th><th>Obs</th>' +
        '</tr></thead><tbody>';

      html += '<tr><td colspan="2" style="text-align:left; font-weight:700; background:#f8fafc;">' +
        esc(studentId) + ' - ' + esc(studentName) + '</td>' +
        '<td colspan="' + (showSR ? 7 : 6) + '" style="background:#f8fafc;"></td></tr>';

      Object.keys(r.modules).forEach(function (modKey) {
        var mod = r.modules[modKey];
        var modLabel = modKey.replace(/_[A-Z]+$/, '');

        html += '<tr class="module-row">' +
          '<td>' + esc(modLabel) + '</td>' +
          '<td>' + esc(mod.name || '') + '</td>' +
          '<td colspan="' + (showSR ? 4 : 3) + '"></td>' +
          '<td>' + (Math.round(r.moduleAvg[modKey] * 100) / 100) + '</td>' +
          '<td>' + r.moduleCredits[modKey].toFixed(1) + '</td>' +
          '<td class="badge-' + r.moduleStatus[modKey] + '">' + r.moduleStatus[modKey] + '</td>' +
          '</tr>';

        (mod.subjects || []).forEach(function (subject) {
          var n = notes[subject] || {};
          var tpVal = hasTP(subject) && n['TP'] !== undefined ? n['TP'].toFixed(2) : '';
          var ccVal = n['Controle continu'] !== undefined ? n['Controle continu'].toFixed(2) : '';
          var examVal = n['Examen'] !== undefined ? n['Examen'].toFixed(2) : '';
          var rattVal = n['Rattrapage'] !== undefined ? n['Rattrapage'].toFixed(2) : '';
          var credit = getCredits(dept, sem, subject);

          html += '<tr>' +
            '<td></td>' +
            '<td class="subject-name">' + esc(displayName(subject)) + '</td>' +
            '<td class="note-value">' + tpVal + '</td>' +
            '<td class="note-value">' + ccVal + '</td>' +
            '<td class="note-value">' + examVal + '</td>' +
            (showSR ? '<td class="note-value">' + rattVal + '</td>' : '') +
            '<td class="note-value">' + (Math.round(r.subjectAvg[subject] * 100) / 100) + '</td>' +
            '<td>' + credit.toFixed(1) + '</td>' +
            '<td class="badge-' + r.subjectStatus[subject] + '">' + r.subjectStatus[subject] + '</td>' +
            '</tr>';
        });
      });

      html += '<tr class="total-row">' +
        '<td colspan="' + colspanTotal + '" style="text-align:right;">Moyenne Semestre :</td>' +
        '<td>' + r.overallAvg + '</td>' +
        '<td></td>' +
        '<td class="badge-' + (r.semesterStatus === 'Valide' ? 'V' : 'NV') + '">' +
        (r.semesterStatus === 'Valide' ? 'V' : 'NV') + '</td>' +
        '</tr></tbody></table></div>';

      html += '<button type="button" class="pdf-btn" onclick="window.generatePDF()">Telecharger le releve PDF</button>';
      html += '</div>';

      return html;
    }

    // ==================== RENDER PARTIAL ====================
    function renderPartial(studentId, studentName, notes, dept, sem, check) {
      var availableSubjects = Object.keys(notes).sort();

      var html =
        '<div class="card">' +
        '<div class="student-info">' +
        '<div>' +
        '<h3>' + esc(studentName || 'Etudiant') + '</h3>' +
        '<p>Numero : <strong>' + esc(studentId) + '</strong> | ' +
        'Departement : <strong>' + esc(dept) + '</strong> | ' +
        '<span class="semester-pill">' + esc(sem) + '</span></p>' +
        '</div>' +
        '<span class="status-pill pending">En attente</span>' +
        '</div>';

      html += '<div class="info-box">' +
        '<strong>Resultats non finalises.</strong> ' +
        check.completeCount + ' matiere(s) sur ' + check.total + ' sont completes. ' +
        'La moyenne sera calculee des que toutes les notes seront disponibles.' +
        '</div>';

      if (availableSubjects.length === 0) {
        html += '<div class="empty-state"><p>Aucune note disponible pour le moment.</p></div>';
      } else {
        html += '<div class="table-wrap"><table><thead><tr>' +
          '<th>Matiere</th><th>TP</th><th>CC</th><th>Examen</th><th>Rattrapage</th>' +
          '</tr></thead><tbody>';
        availableSubjects.forEach(function (subject) {
          var n = notes[subject] || {};
          html += '<tr>' +
            '<td class="subject-name">' + esc(displayName(subject)) + '</td>' +
            '<td class="note-value">' + (n['TP'] !== undefined ? n['TP'].toFixed(2) : '<span class="note-missing">-</span>') + '</td>' +
            '<td class="note-value">' + (n['Controle continu'] !== undefined ? n['Controle continu'].toFixed(2) : '<span class="note-missing">-</span>') + '</td>' +
            '<td class="note-value">' + (n['Examen'] !== undefined ? n['Examen'].toFixed(2) : '<span class="note-missing">-</span>') + '</td>' +
            '<td class="note-value">' + (n['Rattrapage'] !== undefined ? n['Rattrapage'].toFixed(2) : '<span class="note-missing">-</span>') + '</td>' +
            '</tr>';
        });
        html += '</tbody></table></div>';
      }

      if (check.missing.length > 0) {
        html += '<div class="missing-table">' +
          '<h4 style="color:#dc2626; font-size:14px; margin:16px 0 8px 0;">Details des donnees manquantes</h4>' +
          '<div class="table-wrap"><table><thead><tr>' +
          '<th>Matiere</th><th>Element(s) manquant(s)</th>' +
          '</tr></thead><tbody>';
        check.missing.forEach(function (m) {
          html += '<tr>' +
            '<td class="subject-name">' + esc(displayName(m.subject)) + '</td>' +
            '<td style="color:#dc2626; font-weight:600;">' + m.missing.join(', ') + '</td>' +
            '</tr>';
        });
        html += '</tbody></table></div></div>';
      }

      html += '</div>';
      return html;
    }

    // ==================== PDF ====================
    window.generatePDF = function () {
      if (!pdfState) { alert('Donnees non disponibles'); return; }

      var notes = pdfState.notes;
      var results = pdfState.results;
      var studentId = pdfState.studentId;
      var studentName = pdfState.studentName;
      var dept = pdfState.dept;
      var sem = pdfState.sem;
      var showSR = results.hasSR;
      var year = new Date().getFullYear();
      var academicYear = (year - 1) + '-' + year;

      var html =
        '<div style="padding:15mm 10mm; font-family:Arial,Helvetica,sans-serif; font-size:11pt;">' +
        '<div style="font-weight:bold; font-size:13pt;">Ecole Superieure d\'Agronomie de Villeneuve (ESAV)</div>' +
        '<div style="display:flex; justify-content:space-between; margin-top:10px;">' +
        '<span style="font-weight:bold; font-size:14pt;">Releve de notes - ' + esc(sem) + ' - ' + esc(dept) + '</span>' +
        '<span>Annee : ' + academicYear + '</span>' +
        '</div>' +
        '<table style="width:100%; border-collapse:collapse; border:1px solid #000; font-size:10pt; margin-top:12px;">' +
        '<thead><tr style="background:#e6f4f9;">' +
        '<th style="border:1px solid #000; padding:5px;">Module</th>' +
        '<th style="border:1px solid #000; padding:5px;">Matiere</th>' +
        '<th style="border:1px solid #000; padding:5px;">TP</th>' +
        '<th style="border:1px solid #000; padding:5px;">CC</th>' +
        '<th style="border:1px solid #000; padding:5px;">Exam</th>' +
        (showSR ? '<th style="border:1px solid #000; padding:5px;">SR</th>' : '') +
        '<th style="border:1px solid #000; padding:5px;">Moy</th>' +
        '<th style="border:1px solid #000; padding:5px;">Credit</th>' +
        '<th style="border:1px solid #000; padding:5px;">Obs</th>' +
        '</tr></thead><tbody>' +
        '<tr style="background:#f8fafc; font-weight:bold;">' +
        '<td colspan="2" style="border:1px solid #000; padding:5px; text-align:left;">' +
        esc(studentId) + ' - ' + esc(studentName) + '</td>' +
        '<td colspan="' + (showSR ? 7 : 6) + '" style="border:1px solid #000; padding:5px;"></td>' +
        '</tr>';

      Object.keys(results.modules).forEach(function (modKey) {
        var mod = results.modules[modKey];
        var modLabel = modKey.replace(/_[A-Z]+$/, '');
        html += '<tr style="background:#e6f4f9; font-weight:bold;">' +
          '<td style="border:1px solid #000; padding:4px;">' + esc(modLabel) + '</td>' +
          '<td style="border:1px solid #000; padding:4px; text-align:left;">' + esc(mod.name || '') + '</td>' +
          '<td colspan="' + (showSR ? 4 : 3) + '" style="border:1px solid #000; padding:4px;"></td>' +
          '<td style="border:1px solid #000; padding:4px;">' + (Math.round(results.moduleAvg[modKey] * 100) / 100) + '</td>' +
          '<td style="border:1px solid #000; padding:4px;">' + results.moduleCredits[modKey].toFixed(1) + '</td>' +
          '<td style="border:1px solid #000; padding:4px;">' + results.moduleStatus[modKey] + '</td>' +
          '</tr>';

        (mod.subjects || []).forEach(function (subject) {
          var n = notes[subject] || {};
          var tpVal = hasTP(subject) && n['TP'] !== undefined ? n['TP'].toFixed(2) : '';
          var ccVal = n['Controle continu'] !== undefined ? n['Controle continu'].toFixed(2) : '';
          var examVal = n['Examen'] !== undefined ? n['Examen'].toFixed(2) : '';
          var rattVal = n['Rattrapage'] !== undefined ? n['Rattrapage'].toFixed(2) : '';
          var credit = getCredits(dept, sem, subject);

          html += '<tr>' +
            '<td style="border:1px solid #000; padding:3px;"></td>' +
            '<td style="border:1px solid #000; padding:3px; text-align:left; padding-left:15px;">' + esc(displayName(subject)) + '</td>' +
            '<td style="border:1px solid #000; padding:3px; text-align:center;">' + tpVal + '</td>' +
            '<td style="border:1px solid #000; padding:3px; text-align:center;">' + ccVal + '</td>' +
            '<td style="border:1px solid #000; padding:3px; text-align:center;">' + examVal + '</td>' +
            (showSR ? '<td style="border:1px solid #000; padding:3px; text-align:center;">' + rattVal + '</td>' : '') +
            '<td style="border:1px solid #000; padding:3px; text-align:center; font-weight:bold;">' + (Math.round(results.subjectAvg[subject] * 100) / 100) + '</td>' +
            '<td style="border:1px solid #000; padding:3px; text-align:center;">' + credit.toFixed(1) + '</td>' +
            '<td style="border:1px solid #000; padding:3px; text-align:center;">' + results.subjectStatus[subject] + '</td>' +
            '</tr>';
        });
      });

      var colspanTotal = showSR ? 6 : 5;
      html += '<tr style="font-weight:bold;">' +
        '<td colspan="' + colspanTotal + '" style="border:none; padding:8px 4px; text-align:right;">Moyenne Semestre :</td>' +
        '<td style="border:none; padding:8px 4px; text-align:center;">' + results.overallAvg + '</td>' +
        '<td style="border:none;"></td>' +
        '<td style="border:none; padding:8px 4px; text-align:center;">' + results.semesterStatus + '</td>' +
        '</tr></tbody></table></div>';

      var el = document.createElement('div');
      el.innerHTML = html;
      document.body.appendChild(el);

      html2pdf().set({
        margin: [0, 5, 5, 5],
        filename: 'Releve_' + studentId + '_' + dept + '_' + sem + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, letterRendering: true, scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(el).save().then(function () {
        document.body.removeChild(el);
      });
    };

    // ==================== INIT ====================
    loadStructure().then(function () {
      console.log('Pret.');
    });

  })();
  </script>
</body>
</html>
